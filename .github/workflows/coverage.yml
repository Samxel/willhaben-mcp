name: coverage
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
concurrency:
  group: coverage-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live listing counts
        run: python scripts/update_coverage.py
      - name: Fetch clone traffic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/traffic/clones" > clones_raw.json
          python scripts/update_clones.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json clones.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update coverage and clone counts"
          git pull --rebase origin main
          git push
