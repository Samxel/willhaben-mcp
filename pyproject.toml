[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "willhaben-mcp"
version = "1.0.0"
description = "MCP server for willhaben.at: marketplace, used cars and real estate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samxel" }]
keywords = ["mcp", "willhaben", "classifieds", "claude"]
dependencies = ["mcp>=2.3.0,<3", "httpx[http2]>=0.28.1"]

[project.scripts]
willhaben-mcp = "willhaben.server:main"

[project.urls]
Repository = "https://github.com/Samxel/willhaben-mcp"
Issues = "https://github.com/Samxel/willhaben-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["willhaben"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "tests", "scripts"]
